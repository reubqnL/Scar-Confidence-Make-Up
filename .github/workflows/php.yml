name: Scar Confidence

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, mysqlnd
        coverage: none

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Check PHP syntax
      run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: Check types
      run: npm run typecheck

    - name: Build assets
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Run PHP smoke tests
      run: npm run test:php
